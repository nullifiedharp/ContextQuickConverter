# Builds QuickConvert-Setup-<version>.exe on GitHub's Windows servers.
# Download it from the Actions run's "Artifacts". Pushing a tag like v1.2.0
# also publishes it as a GitHub Release.
name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "from quickconvert.formats import APP_VERSION as v; print(v)"
          "version=$v" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Tag $env:GITHUB_REF_NAME doesn't match APP_VERSION $v in quickconvert/formats.py"
          }
      - name: Test conversions
        run: python tests/test_convert.py
      - name: Build exe
        run: pyinstaller QuickConvert.spec --noconfirm --clean
      - name: Build installer
        shell: pwsh
        run: |
          python tools/make_installer_menus.py
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /Q "/DAppVersion=${{ steps.ver.outputs.version }}" installer\QuickConvert.iss
          if ($LASTEXITCODE) { throw "ISCC failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: QuickConvert-Setup-${{ steps.ver.outputs.version }}
          path: installer/QuickConvert-Setup-*.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/QuickConvert-Setup-*.exe
